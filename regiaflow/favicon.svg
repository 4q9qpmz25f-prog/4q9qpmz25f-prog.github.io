<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="clapClip">
      <rect x="140" y="290" width="744" height="170" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- board body -->
  <rect x="180" y="470" width="664" height="380" rx="40" fill="#ffffff"/>
  <rect x="180" y="470" width="664" height="70" fill="#f0f0f3"/>
  <rect x="180" y="470" width="664" height="18" fill="#ffffff"/>

  <!-- clapper top bar, tilted -->
  <g transform="rotate(-9 512 375)">
    <g clip-path="url(#clapClip)">
      <rect x="140" y="290" width="744" height="170" fill="#ffffff"/>
      <g fill="#18181b">
        <rect x="120" y="270" width="70" height="210" transform="skewX(-22)"/>
        <rect x="270" y="270" width="70" height="210" transform="skewX(-22)"/>
        <rect x="420" y="270" width="70" height="210" transform="skewX(-22)"/>
        <rect x="570" y="270" width="70" height="210" transform="skewX(-22)"/>
        <rect x="720" y="270" width="70" height="210" transform="skewX(-22)"/>
        <rect x="870" y="270" width="70" height="210" transform="skewX(-22)"/>
      </g>
    </g>
  </g>

  <!-- hinge dot -->
  <circle cx="205" cy="480" r="14" fill="#18181b" opacity="0.15"/>
</svg>
