<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luca Tiburzi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
    }

    .avatar {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #0a84ff, #30d158);
      border-radius: 50%;
      margin: 0 auto 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 32px rgba(10,132,255,0.25);
    }

    h1 {
      font-size: 36px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px; margin-bottom: 12px;
    }

    .tagline {
      color: #6b7280; font-size: 16px; line-height: 1.7;
      margin-bottom: 40px;
    }

    .links {
      display: flex; flex-direction: column; gap: 12px;
    }

    .link-btn {
      display: block;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 16px 24px;
      text-decoration: none;
      color: #e0e0e0;
      font-size: 15px; font-weight: 600;
      transition: border-color .2s, color .2s, transform .15s;
    }
    .link-btn:hover {
      border-color: #0a84ff;
      color: #fff;
      transform: translateY(-1px);
    }
    .link-btn .sub {
      display: block;
      font-size: 12px; font-weight: 400;
      color: #4b5563;
      margin-top: 3px;
    }
    .link-btn:hover .sub { color: #6b7280; }

    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      text-align: center; padding: 20px;
      color: #374151; font-size: 12px;
    }
    footer a { color: #4b5563; text-decoration: none; }
    footer a:hover { color: #9ca3af; }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">👋</div>
    <h1>Luca Tiburzi</h1>
    <p class="tagline">LT · Italia</p>

    <div class="links">
      <a class="link-btn" href="mailto:luca@lucatiburzi.it">
        ✉️ Scrivimi
        <span class="sub">luca@lucatiburzi.it</span>
      </a>
    </div>
  </div>

  <footer></footer>

</body>
</html>
