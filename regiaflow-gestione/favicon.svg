<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="clapClip">
      <rect x="232" y="190" width="560" height="128" rx="23"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- ciak, a filo con la prima riga sotto -->
  <g transform="rotate(-9 512 254)">
    <g clip-path="url(#clapClip)">
      <rect x="232" y="190" width="560" height="128" fill="#ffffff"/>
      <g fill="#18181b">
        <rect x="217" y="175" width="53" height="158" transform="skewX(-22)"/>
        <rect x="330" y="175" width="53" height="158" transform="skewX(-22)"/>
        <rect x="443" y="175" width="53" height="158" transform="skewX(-22)"/>
        <rect x="556" y="175" width="53" height="158" transform="skewX(-22)"/>
        <rect x="669" y="175" width="53" height="158" transform="skewX(-22)"/>
        <rect x="782" y="175" width="53" height="158" transform="skewX(-22)"/>
      </g>
    </g>
  </g>

  <!-- righe della scaletta -->
  <rect x="232" y="374" width="560" height="92" rx="46" fill="#ffffff" opacity="0.92"/>
  <rect x="172" y="494" width="680" height="92" rx="46" fill="#ffffff"/>
  <circle cx="230" cy="540" r="17" fill="#ff4d4d"/>
  <rect x="272" y="614" width="480" height="92" rx="46" fill="#ffffff" opacity="0.68"/>
  <rect x="202" y="734" width="620" height="92" rx="46" fill="#ffffff" opacity="0.42"/>
</svg>
